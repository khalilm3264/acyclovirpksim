<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<script defer src="/assets/measurement-pixel.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet the Cats | AyFlux</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/learn/learn.css">
  <style>
    .cat-panel{max-width:720px;margin:0 auto;padding:22px}
    .cat-panel h1{font-size:19px}
    .cat-panel .intro{margin-bottom:14px;color:#52667c}
    .cat-image{display:block;width:min(100%,512px);height:auto;image-rendering:pixelated;margin:15px auto 0;border:1px solid #b7cad9}
    .cat-legend{color:#52667c;font-size:12px;margin:13px 0 0}
    .cat-panel [hidden]{display:none!important}
    .cat-title{font-size:15px;margin:14px 0 0;text-align:center}
    .cat-title:not([hidden])+.cat-image{margin-top:9px}
    .cat-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 0}
    .cat-thumb{width:68px;height:68px;padding:2px;background:#fff;border:2px solid #b7cad9;border-radius:3px;cursor:pointer}
    .cat-thumb img{display:block;width:100%;height:100%;image-rendering:pixelated}
    .cat-thumb:hover{border-color:#2d6084}
    .cat-thumb[aria-pressed="true"]{border-color:#28485e;box-shadow:0 0 0 2px #28485e}
    .cat-thumb:focus-visible{outline:2px solid #238ac4;outline-offset:3px}
    .return{margin-top:18px}
    @media(max-width:600px){.cat-panel{padding:14px}.cat-image{width:100%;max-width:512px}}
  </style>
  <script defer src="/cats/cats.js"></script>
</head>
<body>
  <header class="site-header ay-header">
    <div class="ay-header-brand">
      <img class="ay-brand-mark" src="/ayflux-molecular-logo.svg" alt="" width="42" height="42">
      <div class="ay-title-stack">
        <a class="brand ayflux-logo" href="/" aria-label="AyFlux home"><span class="ay">Ay</span><span class="flux">Flu<span class="x">x</span></span></a>
        <p class="site-subtitle">Acyclovir pharmacokinetics across kidney function and dialysis</p>
      </div>
    </div>
    <a class="ay-guide-link" href="/">← Simulator</a>
  </header>
  <div class="shell">
    <main class="card cat-panel">
      <h1>Meet the AyFlux cats 🐾</h1>
      <p class="intro">A little company while the concentration curves run.</p>
      <h2 class="cat-title" id="catTitle" hidden></h2>
      <img class="cat-image" id="catImage" src="/cats/four-cats.png" alt="Colorful pixel art of four kittens together on a patterned cushion beside a window." width="128" height="128" decoding="async">
      <p class="cat-legend" id="catLegend"><strong>Claire</strong> · <strong>George</strong> · <strong>Sabrina</strong> · <strong>Diamond</strong></p>
      <p class="cat-legend" id="catCaption" hidden></p>
      <div class="cat-picker" id="catPicker" role="group" aria-label="Choose which pixel art to show" hidden></div>
      <p class="return"><a href="/">Return to the simulator</a></p>
    </main>
  </div>
</body>
</html>
