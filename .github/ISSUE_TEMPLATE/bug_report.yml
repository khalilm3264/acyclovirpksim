name: Bug report
description: Report reproducible problems without sharing patient information.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "AyFlux is for education only. Do not include identifiable patient details, access tokens, or secret configuration."
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Use synthetic values and note the AyFlux version/commit if known.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pharmacokinetic modeling
        - Dialysis schedules
        - Chart or interface
        - CSV / PK-Sim / MoBi / R exchange
        - Browser compatibility
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system (optional)
      placeholder: "e.g., Firefox on Windows 11"
