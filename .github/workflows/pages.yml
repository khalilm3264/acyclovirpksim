name: Test and deploy AyFlux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayflux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Stage optional Cartesian heatmap bundle
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund plotly.js-cartesian-dist-min@3.3.1 plotly.js-dist-min@3.3.1 @fontsource/poppins@5.3.0
          node scripts/stage-cartesian.cjs
          node scripts/stage-visualizations.cjs
          node scripts/stage-poppins.cjs
      - name: Check JavaScript syntax
        run: |
          node --check public/assets/vendor/plotly-basic-3.3.1.min.js
          node --check public/assets/vendor/plotly-cartesian-3.3.1.min.js
          node --check scripts/stage-cartesian.cjs
          node --check scripts/stage-poppins.cjs
          node --check public/assets/ayflux-exchange.js
          node --check public/assets/ayflux-version.js
          node --check public/assets/plotly-loader.js
          node --check public/assets/model-integrity.js
          node --check public/assets/osp-import.js
          node --check public/assets/research-workspace.js
          node --check public/assets/pwa-register.js
          node --check public/explore/model.js
          node --check public/explore/worker.js
          node --check public/explore/view.js
          node --check public/sw.js
          node --check public/assets/pk-engine.js
          node --check public/assets/simulator-ui.js
          node --check public/lite/lite.js
          node --check public/assets/lite-fallback.js
          node --check public/assets/simulator-worker.js
      - name: Run AyFlux regression tests
        run: node --test tests/*.test.cjs
      - name: Browser-check explorer and XLSX export
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check-script-markup.cjs
          node scripts/check-visualizations.cjs

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Stage optional Cartesian heatmap bundle
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund plotly.js-cartesian-dist-min@3.3.1 plotly.js-dist-min@3.3.1 @fontsource/poppins@5.3.0
          node scripts/stage-cartesian.cjs
          node scripts/stage-visualizations.cjs
          node scripts/stage-poppins.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload public directory
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    # Deploy only when enabled in repository variables and after tests pass.
    # GitHub secrets provide Cloudflare credentials. See README.md.
    if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-production
      url: https://ayflux.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify Cloudflare deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi
      - name: Stage optional Cartesian heatmap bundle
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund plotly.js-cartesian-dist-min@3.3.1 plotly.js-dist-min@3.3.1 @fontsource/poppins@5.3.0
          node scripts/stage-cartesian.cjs
          node scripts/stage-visualizations.cjs
          node scripts/stage-poppins.cjs
      - name: Deploy tested Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

