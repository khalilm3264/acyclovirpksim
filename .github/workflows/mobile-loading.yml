name: Mobile loading states

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-loading-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install and stage application assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npm run stage
      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Check emulated mobile loading and recovery
        run: node scripts/check-mobile-loading-states.cjs
      - name: Upload loading-state screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-loading-screenshots
          path: research/validation/results/screenshots/
          if-no-files-found: warn
          retention-days: 7
